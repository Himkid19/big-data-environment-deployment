version: '3.5'
services:
  zookeeper_1:
    image: wurstmeister/zookeeper   ## 镜像
    container_name: zookeeper_1
    ports:
      - "2181:2181"                 ## 对外暴露的端口号
  broker_1:
    hostname: broker_1
    depends_on:
      - zookeeper_1
    image: wurstmeister/kafka       ## 镜像
    container_name: broker_1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_1:2181